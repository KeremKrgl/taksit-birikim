<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışı · Taksit & Birikim</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f5; --fg: #14201b; --muted: #4b5751; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e1512; --fg: #e9efeb; --muted: #a9b5ae; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 26rem; text-align: center; }
      p { color: var(--muted); line-height: 1.5; }
      button { margin-top: 1rem; min-height: 3rem; padding: 0 1.5rem; border: 0; border-radius: .875rem; background: #0b6b4b; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1 lang="tr">Çevrimdışısın</h1>
      <p lang="tr">Bu sayfayı daha önce açmadığın için gösteremiyoruz. İnternete bağlanınca tekrar dene.</p>
      <p lang="en">You're offline, and this page hasn't been opened before. Try again when you're back online.</p>
      <button type="button" onclick="location.reload()">Tekrar dene / Retry</button>
    </main>
  </body>
</html>
